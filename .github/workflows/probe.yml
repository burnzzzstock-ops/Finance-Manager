name: Probe dealer site
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe astroford.com
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36"
          for p in "" "robots.txt" "sitemap.xml" "inventory/new" "inventory/used" "searchall.aspx"; do
            code=$(curl -s -o /tmp/out --max-time 25 -A "$UA" -H "Accept: text/html,application/xhtml+xml" -w "%{http_code}" "https://www.astroford.com/$p" || echo "ERR")
            size=$(wc -c < /tmp/out 2>/dev/null || echo 0)
            echo "== /$p -> HTTP $code ($size bytes)"
          done

          echo ""
          echo "===== inventory/new analysis ====="
          curl -s --max-time 30 -A "$UA" -H "Accept: text/html" "https://www.astroford.com/inventory/new" -o /tmp/inv.html || true
          echo "size: $(wc -c < /tmp/inv.html) bytes"
          echo "--- platform markers ---"
          grep -io -m1 'dealeron' /tmp/inv.html || echo "no dealeron marker"
          grep -io -m1 'dealer\.com\|ddc-' /tmp/inv.html | head -1 || echo "no dealer.com marker"
          grep -io -m1 'dealerinspire' /tmp/inv.html || echo "no dealerinspire marker"
          echo "--- data markers ---"
          grep -c 'application/ld+json' /tmp/inv.html || true
          grep -o -m3 'stockNumber' /tmp/inv.html | head -3 || echo "no stockNumber"
          grep -o -m3 'vehicleIdentificationNumber' /tmp/inv.html | head -3 || echo "no VIN field"
          grep -o 'window\.[A-Za-z_$]\+' /tmp/inv.html | sort | uniq -c | sort -rn | head -15 || true
          echo "--- first JSON-LD block (truncated) ---"
          tr -d '\n' < /tmp/inv.html | grep -o '<script type="application/ld+json">[^<]\{0,3000\}' | head -c 3000 || echo "none found"
          echo ""
          echo "--- html head ---"
          head -c 1500 /tmp/inv.html
